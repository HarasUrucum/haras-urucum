<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Morador | Haras Urucum</title>
    <!-- Fonte Google Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }

        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.85;
            font-weight: 300;
        }

        .content {
            padding: 25px 20px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #555555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: #f9fbfd;
        }

        .input-group input:focus {
            border-color: #2a5298;
            background: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60 0%, #2ec76f 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        .btn-logout {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.25);
            margin-top: 15px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 8px;
            border: none;
            cursor: pointer;
        }

        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: left;
        }

        .info-card-avisos {
            background: #fffbe3;
            border: 1px solid #ffe58f;
        }

        .info-label {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
        }

        .grid-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .grid-links a {
            background: #f1f5f9;
            color: #334155;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            border: 1px solid #cbd5e1;
            transition: background 0.2s;
        }

        .grid-links a:hover {
            background: #e2e8f0;
        }

        /* Botão Flutuante do WhatsApp */
        .btn-whats-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            z-index: 999;
            transition: transform 0.2s;
        }

        .btn-whats-float:active {
            transform: scale(0.9);
        }

        .btn-whats-float svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .hidrometro-wrapper {
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .hidrometro-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            display: block;
        }

        .erro {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Ícone Flutuante do WhatsApp -->
    <a href="https://wa.me/5511943430475?text=Olá,%20sou%20morador%20do%20Haras%20Urucum%20e%20preciso%20de%20atendimento." target="_blank" class="btn-whats-float" title="Falar no WhatsApp">
        <svg viewBox="0 0 24 24">
            <path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.762.459 3.48 1.332 5.001l-1.416 5.169 5.291-1.387c1.472.802 3.13 1.224 4.78 1.225h.004c5.506 0 9.99-4.478 9.99-9.985 0-2.667-1.038-5.176-2.925-7.062a9.925 9.925 0 0 0-7.066-2.945zm0 1.768c4.528 0 8.217 3.689 8.218 8.217 0 2.196-.856 4.258-2.408 5.811-1.553 1.552-3.616 2.407-5.811 2.407h-.003c-1.396 0-2.771-.355-3.985-1.028l-.286-.159-2.962.776.79-2.887-.174-.277c-.739-1.184-1.13-2.55-1.13-3.952 0-4.528 3.689-8.218 8.218-8.218zm-2.02 4.242c-.225 0-.589.085-.898.423-.309.338-1.18 1.153-1.18 2.812 0 1.658 1.208 3.261 1.377 3.487.169.225 2.38 3.633 5.765 5.094.805.348 1.433.556 1.923.712.808.257 1.543.221 2.125.134.648-.097 1.996-.816 2.277-1.603.281-.787.281-1.462.197-1.603-.084-.141-.309-.225-.647-.394-.338-.169-1.996-.984-2.305-1.096-.309-.113-.534-.169-.759.169-.225.338-.872 1.096-1.069 1.321-.197.225-.394.253-.731.084-.338-.169-1.427-.526-2.718-1.677-1.005-.896-1.683-2.002-1.88-2.34-.197-.338-.021-.521.148-.689.152-.151.338-.394.506-.591.169-.197.225-.338.338-.562.113-.225.056-.423-.028-.591-.084-.169-.759-1.83-1.04-2.503-.273-.655-.55-.566-.759-.576l-.647-.008z"/>
        </svg>
    </a>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <div class="header-icon">🏡</div>
            <h1>Haras Urucum</h1>
            <p>Portal de Serviços ao Morador</p>
        </div>

        <div class="content">
            <!-- Tela de Login -->
            <div id="sec-login">
                <div class="input-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" placeholder="Ex: lote01" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>
                <button class="btn" onclick="fazerLogin()">Acessar Portal</button>
                <p id="msg-erro" class="erro"></p>
            </div>

            <!-- Painel do Morador -->
            <div id="sec-painel" class="hidden">
                <div class="info-card" style="background: #edf2f7; border-color: #cbd5e0;">
                    <div class="info-value" id="boas-vindas">Lote --</div>
                </div>

                <!-- Informativos do Condomínio -->
                <div class="info-card info-card-avisos">
                    <div class="info-label" style="color: #b78103;">📢 Informativos</div>
                    <div class="aviso-texto" style="font-size:0.85rem; color:#856404;" id="txt-informativo">
                        Seja bem-vindo ao Portal de Serviços ao Morador!
                    </div>
                </div>

                <!-- Foto do Hidrômetro Cadastrada -->
                <div id="box-foto" class="hidrometro-wrapper hidden">
                    <img id="img-foto" src="" alt="Foto do Hidrômetro" class="hidrometro-img">
                </div>

                <!-- Consumo de Água -->
                <div class="info-card">
                    <div class="info-label">💧 Consumo de Água</div>
                    <div class="info-value" id="val-agua">--</div>
                </div>

                <!-- Boleto -->
                <div class="info-card">
                    <div class="info-label">📄 Boleto</div>
                    <div id="area-boleto">
                        <span style="font-size:0.85rem; color:#94a3b8;">Nenhum boleto disponível.</span>
                    </div>
                </div>

                <!-- Links Rápidos: Atas e Calendário -->
                <div class="grid-links">
                    <a id="link-atas" href="#" target="_blank">📋 Atas</a>
                    <a id="link-calendario" href="#" target="_blank">📅 Calendário</a>
                </div>

                <button class="btn btn-logout" onclick="sair()">Encerrar Sessão</button>
            </div>
        </div>
    </div>

    <script>
        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const msgErro = document.getElementById('msg-erro');
            
            msgErro.innerText = '';

            if(!usuario || !senha) {
                msgErro.innerText = 'Preencha usuário e senha.';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await res.json();

                if(data.sucesso) {
                    carregarPainel(data.dados);
                } else {
                    msgErro.innerText = data.mensagem || 'Usuário ou senha incorretos.';
                }
            } catch(e) {
                msgErro.innerText = 'Erro ao conectar ao servidor.';
            }
        }

        function carregarPainel(dados) {
            document.getElementById('sec-login').classList.add('hidden');
            document.getElementById('sec-painel').classList.remove('hidden');

            document.getElementById('boas-vindas').innerText = `Lote ${dados.lote} • ${dados.morador}`;
            document.getElementById('val-agua').innerText = dados.leituraAgua || 'Sem leitura';

            // Trata Foto do Hidrômetro
            const boxFoto = document.getElementById('box-foto');
            const imgFoto = document.getElementById('img-foto');
            if(dados.fotoHidrometro && dados.fotoHidrometro.startsWith('http')) {
                imgFoto.src = dados.fotoHidrometro;
                boxFoto.classList.remove('hidden');
            } else {
                boxFoto.classList.add('hidden');
            }

            // Trata Boleto
            const areaBoleto = document.getElementById('area-boleto');
            if(dados.boletoPdf && dados.boletoPdf.startsWith('http')) {
                areaBoleto.innerHTML = `<a href="${dados.boletoPdf}" target="_blank" class="btn-action">📥 Baixar Boleto (PDF)</a>`;
            } else {
                areaBoleto.innerHTML = `<span style="font-size:0.85rem; color:#94a3b8;">Boleto indisponível.</span>`;
            }

            // Links das Atas e Calendário
            document.getElementById('link-atas').href = dados.linkAtas || '#';
            document.getElementById('link-calendario').href = dados.linkCalendario || '#';
        }

        function sair() {
            document.getElementById('sec-painel').classList.add('hidden');
            document.getElementById('sec-login').classList.remove('hidden');
            document.getElementById('usuario').value = '';
            document.getElementById('senha').value = '';
        }
    </script>
</body>
</html>
